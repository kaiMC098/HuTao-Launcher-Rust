[workspace]
resolver = "2"
members = [
    "crates/pojav_core",
    "crates/pojav_ui",
    "crates/pojav_native",
    "crates/pojav_awt",
    "crates/pojav_hooks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.21"
libc = "0.2"
once_cell = "1.19"
log = "0.4"
thiserror = "1.0"
sha1 = "0.10"
uuid = { version = "1.10", features = ["v3", "v4", "serde"] }
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
