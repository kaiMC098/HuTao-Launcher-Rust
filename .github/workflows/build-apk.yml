name: Build HuTao Launcher Rust APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    name: Compile Rust Native Engine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'

      - name: Set up Rust toolchain (4 Android ABIs)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: hutao-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: hutao-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Run Rust core unit tests
        run: cargo test --manifest-path rust/Cargo.toml -p pojav_core -p pojav_ui

      - name: Compile Rust libraries to jniLibs (.so)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          mkdir -p rust_out
          cd rust
          cargo ndk \
            -P 21 \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            -o ../rust_out \
            build --release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "../rust_out/${abi}/libpojavexec_awt.so" "../rust_out/${abi}/libawt_xawt.so"
            cp "../rust_out/${abi}/liblinkerhook.so" "../rust_out/${abi}/libexithook.so"
          done

      - name: Upload Rust jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: rust-jnilibs
          path: rust_out
          retention-days: 1

  build-apk:
    name: Build APK (${{ matrix.arch }})
    needs: build-native
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
            label: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
            label: armeabi-v7a
          - arch: x86_64
            abi: x86_64
            label: x86_64
          - arch: x86
            abi: x86
            label: x86
          - arch: all
            abi: ""
            label: all
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled Rust jniLibs
        uses: actions/download-artifact@v4
        with:
          name: rust-jnilibs
          path: app_pojavlauncher/src/main/jniLibs

      - name: Set up JDK 8 (for LWJGL3 stub toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 21 (for Gradle & Android build)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Download LTW Renderer AAR
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar -O app_pojavlauncher/libs/ltw-release.aar

      - name: Fetch ZalithLauncher 2 Java Runtimes (8/17/21/25) & Renderers
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.arch }}" = "all" ]; then
            EXTRA_ARGS="--standalone"
          fi
          python3 scripts/fetch_zalith_assets.py --arch "${{ matrix.arch }}" ${EXTRA_ARGS}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build HuTao-Launcher-${{ matrix.label }}.apk
        run: |
          sed -i 's/\r$//' gradlew scripts/languagelist_updater.sh
          chmod +x gradlew scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          ./gradlew :jre_lwjgl3glfw:jar :arc_dns_injector:jar :forge_installer:jar --no-daemon

          if [ -n "${{ matrix.abi }}" ]; then
            ./gradlew :app_pojavlauncher:assembleDebug -PtargetAbi="${{ matrix.abi }}" --no-daemon
          else
            ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          fi

          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "out/HuTao-Launcher-${{ matrix.label }}.apk"
          (cd out && sha256sum "HuTao-Launcher-${{ matrix.label }}.apk" > "HuTao-Launcher-${{ matrix.label }}.sha256")
          ls -lh out/

      - name: Upload APK (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: HuTao-Launcher-${{ matrix.label }}
          path: |
            out/HuTao-Launcher-${{ matrix.label }}.apk
            out/HuTao-Launcher-${{ matrix.label }}.sha256

      - name: Upload Standalone Java Runtimes (.tar.xz - JRE 8/17/21/25)
        if: matrix.arch == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: HuTao-Java-Runtimes-arm64
          path: out/standalone_jres/*.tar.xz
          if-no-files-found: ignore
